[package]
name = "life-os-backend"
version = "0.1.0"
edition = "2021"
description = "Life OS Rust & Tauri Backend Core"

[lib]
name = "life_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "life-os"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31.0", features = ["bundled-sqlcipher"] }
argon2 = "0.5.3"
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }
sha2 = "0.10.8"
hex = "0.4.3"
rand = "0.8.5"
chrono = { version = "0.4.38", features = ["serde"] }
thiserror = "2.0.11"

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }
